apiVersion: apiextensions.k8s.io/v1
name: "HostedControlPlane publishing validation [OCPFeatureGate:ServicePublishingAPI] [Jira:HyperShift]"
crdName: hostedcontrolplanes.hypershift.openshift.io
featureGates:
  - ServicePublishingAPI
version: v1beta1
tests:
  onCreate:
    - name: When a dedicated API preset omits endpoint overrides, it should accept derived hostnames
      initial: |
        apiVersion: hypershift.openshift.io/v1beta1
        kind: HostedControlPlane
        spec:
          releaseImage: quay.io/openshift-release-dev/ocp-release:4.21.10-x86_64
          pullSecret:
            name: pull-secret
          issuerURL: https://issuer.example.com
          sshKey:
            name: ssh-key
          infraID: publishing-test
          etcd:
            managementType: Managed
            managed:
              storage:
                type: PersistentVolume
                persistentVolume:
                  size: 8Gi
          platform:
            type: None
          dns:
            baseDomain: example.com
          publishing:
            type: DedicatedAPIServerEndpoint
    - name: When publishing and legacy services are both absent, it should reject the missing source
      initial: |
        apiVersion: hypershift.openshift.io/v1beta1
        kind: HostedControlPlane
        spec:
          releaseImage: quay.io/openshift-release-dev/ocp-release:4.21.10-x86_64
          pullSecret:
            name: pull-secret
          issuerURL: https://issuer.example.com
          sshKey:
            name: ssh-key
          infraID: publishing-test
          etcd:
            managementType: Managed
            managed:
              storage:
                type: PersistentVolume
                persistentVolume:
                  size: 8Gi
          platform:
            type: None
          dns:
            baseDomain: example.com
      expectedError: spec.publishing or non-empty spec.services is required
